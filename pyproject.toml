[project]
name = "meucv-pro-ats"
version = "0.1.0"
description = "Backend Python para MeuCV.pro ATS"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "email-validator>=2.2.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "cachetools>=5.5.2",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
